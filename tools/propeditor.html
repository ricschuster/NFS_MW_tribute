<title>__PLACE__ Props</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* One deliberate look, shared with the Road Editor: a dark bench under a
     lit map. The accent is runway-marking yellow; green saves, amber warns,
     red is a prop that cannot stand where it is. */
  :root {
    color-scheme: dark;
    --ink: #0e1412;
    --panel: #141c1a;
    --panel-2: #1b2623;
    --line: #293833;
    --text: #e2ebe6;
    --dim: #92a69e;
    --accent: #f2c230;
    --save: #7fd6a2;
    --warn: #f0a33c;
    --err: #e9615a;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font: 13px/1.4 var(--sans);
    display: grid;
    grid-template-columns: 300px 1fr;
    overflow: hidden;
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  .sub {
    margin-top: 3px;
    font: 11px var(--mono);
    color: var(--dim);
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
  }
  .scroll { flex: 1; overflow-y: auto; min-height: 0; }
  section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h2 {
    margin: 0 0 8px;
    font: 600 10.5px var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--dim);
  }
  .group + .group { margin-top: 10px; }
  .group-name { font: 500 10.5px var(--mono); color: var(--dim); letter-spacing: 0.05em; margin-bottom: 4px; }
  .kind {
    width: 100%;
    display: grid;
    grid-template-columns: 22px 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    background: transparent;
    color: var(--text);
    border: 1px solid transparent;
    border-radius: 4px;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .kind:hover { background: var(--panel-2); }
  .kind[aria-pressed='true'] { background: var(--panel-2); border-color: var(--accent); }
  .kind:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .kind canvas { width: 22px; height: 22px; }
  /* The drawing tools have no glyph: their text takes the glyph's column too. */
  #k-road, #k-yard { grid-template-columns: 1fr auto; }
  .kind .meta { display: flex; flex-direction: column; min-width: 0; }
  .kind .size { font: 10.5px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .kind .count { font: 500 11px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .field { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 6px 8px; margin-bottom: 6px; }
  .field label { font: 11px var(--mono); color: var(--dim); }
  input, select {
    width: 100%;
    background: var(--ink);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 7px;
    font: 12px var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .xyz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  button.act {
    flex: 1;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 8px;
    font: 500 12px var(--sans);
    cursor: pointer;
  }
  button.act:hover:not(:disabled) { border-color: var(--dim); }
  button.act:disabled { opacity: 0.45; cursor: default; }
  button.save { background: var(--save); border-color: var(--save); color: #06251a; font-weight: 600; }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  .checks { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .checks li { font-size: 12px; padding-left: 14px; position: relative; }
  .checks li::before { content: ''; position: absolute; left: 2px; top: 6px; width: 6px; height: 6px; border-radius: 50%; }
  .checks .err::before { background: var(--err); }
  .checks .warn::before { background: var(--warn); }
  .checks .info::before { background: var(--dim); }
  .checks .ok { color: var(--save); }
  .checks .ok::before { background: var(--save); }
  .empty { color: var(--dim); font-size: 12px; margin: 0; }
  .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
  .layers label { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
  .layers input { width: auto; }
  footer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .status { font: 11px var(--mono); color: var(--dim); display: flex; justify-content: space-between; gap: 8px; }
  .status .dirty { color: var(--accent); }
  #attention { background: none; border: none; padding: 0; font: inherit; color: var(--warn); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  main { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud {
    position: absolute;
    left: 12px;
    bottom: 12px;
    background: rgba(14, 20, 18, 0.86);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 9px;
    font: 11px var(--mono);
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    display: flex;
    gap: 12px;
    pointer-events: none;
  }
  .hud b { color: var(--text); font-weight: 500; }
  .hint {
    position: absolute;
    left: 50%;
    top: 12px;
    transform: translateX(-50%);
    background: rgba(14, 20, 18, 0.9);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    pointer-events: none;
  }
  .hint kbd { font: 11px var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; }
  .zoom button {
    width: 32px; height: 32px;
    background: rgba(20, 28, 26, 0.92);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: 500 15px var(--mono);
    cursor: pointer;
  }
  #toast {
    position: absolute;
    right: 12px;
    bottom: 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 12px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.18s, transform 0.18s;
    pointer-events: none;
  }
  #toast.on { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 45%) 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--line); }
    .hint { white-space: normal; width: calc(100% - 80px); text-align: center; }
  }
</style>

<aside>
  <header>
    <h1>__PLACE__ Props</h1>
    <div class="sub" id="sub">—</div>
  </header>
  <div class="scroll">
    <section id="roads-section" hidden>
      <h2>Roads</h2>
      <button class="kind" id="k-road" aria-pressed="false"><span class="meta"><span>Draw a road</span><span class="size">click points · Enter or double-click to finish</span></span><span class="count" id="c-road"></span></button>
      <button class="kind" id="k-yard" aria-pressed="false"><span class="meta"><span>Draw a yard</span><span class="size">paved, drivable, no traffic · click its corners</span></span><span class="count" id="c-yard"></span></button>
    </section>
    <section>
      <h2>Place</h2>
      <div id="palette"></div>
    </section>
    <section id="inspector">
      <h2>Selected</h2>
      <p class="empty" id="none">Nothing selected. Pick a prop above and click the map to place it, or click one already placed.</p>
      <div id="road-detail" hidden>
        <div class="field"><label>Road</label><div id="r-id"></div></div>
        <div class="field"><label for="r-kind">Class</label><select id="r-kind"><option value="street">street</option><option value="boulevard">boulevard</option><option value="yard">yard</option></select></div>
        <div class="field"><label for="r-surface">Surface</label><select id="r-surface"><option value="asphalt">asphalt</option><option value="gravel">gravel</option><option value="dirt">dirt</option><option value="rail">rail</option></select></div>
        <div class="field"><label for="r-dead">Dead end</label><input id="r-dead" type="checkbox" style="justify-self:start"></div>
        <ul class="checks" id="r-info"></ul>
        <div class="row">
          <button class="act" id="r-delpoint" title="Delete the selected point (Del)">Delete point</button>
          <button class="act danger" id="r-del" title="Delete the road (Del with no point selected)">Delete road</button>
        </div>
      </div>
      <div id="detail" hidden>
        <div class="field"><label>Prop</label><div id="d-kind"></div></div>
        <div class="field" id="f-variant"><label for="d-variant">Variant</label><select id="d-variant"></select></div>
        <div class="field"><label>x · z · °</label>
          <div class="xyz">
            <input id="d-x" type="number" step="1" aria-label="x in metres">
            <input id="d-z" type="number" step="1" aria-label="z in metres">
            <input id="d-a" type="number" step="5" aria-label="heading in degrees">
          </div>
        </div>
        <div class="field" id="f-w"><label for="d-w">Span m</label><input id="d-w" type="number" step="0.5" min="1"></div>
        <div class="field"><label for="d-note">Note</label><input id="d-note" type="text" placeholder="e.g. the Hangar Ramp's landing"></div>
        <ul class="checks" id="d-checks"></ul>
        <div class="row">
          <button class="act" id="align" title="Turn it to run along the nearest road (A)">Align to road</button>
          <button class="act" id="dupe" title="Duplicate (Ctrl+D)">Duplicate</button>
          <button class="act danger" id="del" title="Delete (Del)">Delete</button>
        </div>
      </div>
    </section>
    <section>
      <h2>Show</h2>
      <div class="layers" id="layers"></div>
    </section>
  </div>
  <footer>
    <div class="status"><span id="count">—</span><span id="dirty"></span></div>
    <div class="row" style="margin-top:0">
      <button class="act" id="undo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="act" id="revert" title="Back to the last save">Revert</button>
      <button class="act save" id="save">Save placements</button>
    </div>
  </footer>
</aside>
<main>
  <canvas id="map"></canvas>
  <div class="hint" id="hint"></div>
  <div class="zoom">
    <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
    <button id="zfit" title="Fit the field" aria-label="Fit the field">⤢</button>
  </div>
  <div class="hud"><span>x <b id="h-x">—</b></span><span>z <b id="h-z">—</b></span><span>ground <b id="h-y">—</b></span><span id="h-scale"></span></div>
  <div id="toast" role="status"></div>
</main>

<script id="mapdata" type="application/json">__DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('mapdata').textContent);
  const $ = (id) => document.getElementById(id);
  const B = DATA.box;
  const H = DATA.height;
  const cells = Uint8Array.from(atob(H.cells), (c) => c.charCodeAt(0));

  // The catalogue settled on #295. `w` is the span *across* the prop's heading
  // and `l` its length *along* it, both in metres; the heading follows the
  // generator's own convention, direction (sin a, cos a), so a saved angle
  // means the same thing to `places.ts` as it does here. `road` says whether a
  // prop belongs on a carriageway ('must'), may sit on one ('ok'), or blocks
  // one if it does (absent). `flat` props are the ones a slope would show
  // under - a bunker on a hillside is #253's problem arriving early.
  const KINDS = [
    { id: 'gate', group: 'Breakables', name: 'Security gate', w: 10, l: 1.2, shape: 'gate', color: '#ff8a4c', road: 'must' },
    { id: 'stack', group: 'Breakables', name: 'Pallet stack', w: 3, l: 2, shape: 'box', color: '#ff8a4c', road: 'ok', variants: ['pallets', 'drums'] },
    // Faces along its heading, so a board placed at a jump's heading faces
    // the car coming off the lip. Smashed from within `BILLBOARD_HIT`.
    { id: 'billboard', group: 'Collectibles', name: 'Billboard', w: 11, l: 0.6, shape: 'board', color: '#ffd54f', road: 'ok' },
    { id: 'plane-belly', group: 'Planes', name: 'Cargo plane, on its belly', w: 32, l: 30, shape: 'plane', color: '#d6dcdf', flat: true },
    { id: 'plane-nose', group: 'Planes', name: 'Plane, nose-buried', w: 28, l: 16, shape: 'planeNose', color: '#d6dcdf' },
    { id: 'fuselage', group: 'Planes', name: 'Fuselage wreck', w: 4, l: 18, shape: 'fuselage', color: '#d6dcdf', flat: true },
    { id: 'fuselage-hung', group: 'Planes', name: 'Hanging fuselage', w: 8, l: 22, shape: 'hung', color: '#d6dcdf' },
    { id: 'helicopter', group: 'Planes', name: 'Helicopter', w: 14, l: 16, shape: 'heli', color: '#d6dcdf', flat: true },
    { id: 'silo', group: 'Structures', name: 'Silo or tank', w: 8, l: 8, shape: 'circle', color: '#c9925c', flat: true },
    { id: 'water-tower', group: 'Structures', name: 'Water tower', w: 10, l: 10, shape: 'tower', color: '#c9925c', flat: true },
    { id: 'crane', group: 'Structures', name: 'Crane', w: 6, l: 6, shape: 'crane', color: '#c9925c', flat: true, jib: 30 },
    { id: 'mast', group: 'Structures', name: 'Lattice mast', w: 4, l: 4, shape: 'mast', color: '#c9925c', flat: true },
    { id: 'bunker', group: 'Structures', name: 'Concrete bunker', w: 12, l: 8, shape: 'box', color: '#a9aea5', flat: true },
    { id: 'blast-wall', group: 'Structures', name: 'Blast wall', w: 6, l: 1.2, shape: 'box', color: '#a9aea5', road: 'ok' },
    { id: 'shed', group: 'Structures', name: 'Derelict shed', w: 9, l: 14, shape: 'shed', color: '#9c7454', flat: true },
    // The working quarry's (#323), from photographs of active ones.
    { id: 'stockpile', group: 'Quarry', name: 'Stockpile', w: 44, l: 44, shape: 'circle', color: '#b9b2a4', variants: ['grey', 'sand', 'rust'] },
    { id: 'conveyor', group: 'Quarry', name: 'Conveyor belt', w: 3.2, l: 84, shape: 'box', color: '#d9a21b', flat: true },
    { id: 'haul-truck', group: 'Quarry', name: 'Haul truck', w: 16, l: 25, shape: 'box', color: '#e0b020', road: 'ok' },
    { id: 'excavator', group: 'Quarry', name: 'Excavator', w: 9.5, l: 20, shape: 'box', color: '#e2b12a', road: 'ok' },
    { id: 'cabin', group: 'Quarry', name: 'Site cabin', w: 5.8, l: 15.5, shape: 'box', color: '#d7d9d6', flat: true },
    { id: 'crusher', group: 'Quarry', name: 'Crusher hopper', w: 16, l: 16, shape: 'box', color: '#8a5a3c', flat: true },
    { id: 'rubble', group: 'Quarry', name: 'Rubble pile', w: 16, l: 16, shape: 'circle', color: '#b7b3a8', road: 'ok' },
    // Sablet Wharf's container port (#410), sized from real terminals: a 40 ft
    // container is 12.2 m by 2.4 m and 2.6 m high, and a block is a row of

    // apart, so its legs straddle the quay road and you drive under it.

      variants: ['two high', 'three high', 'four high'] },
    { id: 'sts-crane', group: 'Port', name: 'Ship-to-shore crane', w: 30, l: 27, shape: 'box', color: '#e5563a', road: 'ok' },

    { id: 'keep', group: 'Fort', name: 'Keep', w: 15, l: 15, shape: 'circle', color: '#7f796d', flat: true },
    { id: 'palas', group: 'Fort', name: 'Palas (hall)', w: 25.6, l: 54.4, shape: 'box', color: '#8d877a', flat: true },
    { id: 'chapel', group: 'Fort', name: 'Chapel', w: 20, l: 46, shape: 'box', color: '#8d877a', flat: true },

    { id: 'cafe', group: 'Park', name: 'Café', w: 11.2, l: 19.2, shape: 'box', color: '#e2dccd' },

    { id: 'house', group: 'Suburb', name: 'House', w: 16, l: 19.2, shape: 'box', color: '#c9765c', variants: ['cream', 'brick', 'blue', 'green'] },
    { id: 'apartment', group: 'Suburb', name: 'Apartment block', w: 38.4, l: 19.2, shape: 'box', color: '#8a7fc8', variants: ['brick', 'render'] },
    // Midtown south-west's high street (#488).
    { id: 'shop', group: 'Suburb', name: 'Shop, flats over', w: 12.8, l: 19.2, shape: 'box', color: '#c9a25c', variants: ['red', 'green', 'blue', 'black'] },
    { id: 'flat', group: 'Suburb', name: 'Block of flats', w: 25.6, l: 19.2, shape: 'box', color: '#7f9fc8', variants: ['brick', 'render'] },
    // Ashford Point's estates (#293): a villa and its garage, and a manor
    // with its wings forward round a forecourt.
    { id: 'villa', group: 'Suburb', name: 'Villa', w: 33.6, l: 19.2, shape: 'box', color: '#b98a5c', variants: ['cream', 'render', 'brick', 'blue'] },

    // The works (#489), at real size. A gantry's footprint is its legs and

    { id: 'chimney', group: 'Works', name: 'Chimney', w: 7, l: 7, shape: 'box', color: '#8c4a3a' },

    { id: 'gantry', group: 'Works', name: 'Gantry crane', w: 34, l: 7, shape: 'box', color: '#d9a12b' },
    { id: 'rails', group: 'Works', name: 'Rail track, 40 m', w: 3.4, l: 40, shape: 'box', color: '#7d776c', road: 'ok', flat: true },
    { id: 'wagon', group: 'Works', name: 'Rail wagon', w: 3, l: 14, shape: 'box', color: '#8a5a3c', variants: ['box', 'tank'] },
    // Downtown (#268): the old core's terraces and warehouses at the high
    // street's scale, then towers and landmarks at game size. A tower's

  function clean(p) {

  const newId = () => `p${Date.now().toString(36)}${(nextId++).toString(36)}`;

  // ---- ground and roads -----------------------------------------------------
  function heightAt(x, z) {
    const col = Math.round((x - B.minX) / H.step);

  }
  function project(x, z, a, b) {
    const dx = b[0] - a[0];
    const dz = b[1] - a[1];

  const roadHeading = (r) => Math.atan2(r.b[0] - r.a[0], r.b[1] - r.a[1]);

  /** Points spread over a prop's footprint, in world metres. */
  function samples(p) {
    const { w, l } = dims(p);
    const nu = Math.max(2, Math.min(9, Math.ceil(w / 2) + 1));
    const nv = Math.max(2, Math.min(9, Math.ceil(l / 2) + 1));
    const s = Math.sin(p.angle);
    const c = Math.cos(p.angle);

  /** What is wrong with where this prop stands, measured against the export. */

    } else {
      ctx.fillStyle = '#26312c';
      ctx.fillRect(sx(farX), sy(farZ), H.cols * H.step * s, H.rows * H.step * s);
    }

    if (layers.outline) {
      ctx.beginPath();
      ctx.arc(sx(DATA.centre[0]), sy(DATA.centre[1]), DATA.radius * s, 0, Math.PI * 2);
      ctx.setLineDash([6, 6]);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(242,194,48,0.35)';
      ctx.stroke();
      ctx.setLineDash([]);
    }

    if (layers.roads) {
      ctx.lineCap = 'round';
      for (const surface of ['asphalt', 'dirt', 'gravel', 'rail']) {
        ctx.strokeStyle = surface === 'dirt' ? '#a58759' : surface === 'gravel' ? '#b9b3a6' : surface === 'rail' ? '#7a6f62' : '#565f62';
        for (const r of segs) {
          if (r.surface !== surface) continue;
          ctx.lineWidth = Math.max(1.5, r.width * s);
          ctx.beginPath();
          ctx.moveTo(sx(r.a[0]), sy(r.a[1]));
          ctx.lineTo(sx(r.b[0]), sy(r.b[1]));
          ctx.stroke();
        }
      }
      if (layers.outline && DATA.runway.length === 2) {
        const [a, b] = DATA.runway;
        ctx.beginPath();
        ctx.moveTo(sx(a[0]), sy(a[1]));
        ctx.lineTo(sx(b[0]), sy(b[1]));
        ctx.setLineDash([10, 8]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(240,235,220,0.55)';
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // The freeway, to look at (#487): the deck translucent so the streets
    // under it show through, with its pillars; a tunnel dashed; the ramps
    // orange. Not editable here - its line is the freeway editor's.
    if (layers.freeway && DATA.freeway) {
      ctx.lineCap = 'butt';
      for (const r of DATA.freeway.segments) {
        ctx.beginPath();
        ctx.moveTo(sx(r.a[0]), sy(r.a[1]));
        ctx.lineTo(sx(r.b[0]), sy(r.b[1]));
        ctx.lineWidth = Math.max(2, r.width * s);
        if (r.level === 'tunnel') {
          ctx.setLineDash([8, 6]);
          ctx.lineWidth = Math.max(1.5, r.width * s * 0.35);
          ctx.strokeStyle = 'rgba(255,110,110,0.7)';
        } else {
          ctx.strokeStyle = r.class === 'ramp' ? 'rgba(255,160,60,0.5)' : 'rgba(255,80,80,0.38)';
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillStyle = '#c9ced4';
      const pr = Math.max(1.5, 1.1 * s);
      for (const [x, z] of DATA.freeway.pillars) ctx.fillRect(sx(x) - pr, sy(z) - pr, pr * 2, pr * 2);
      ctx.lineCap = 'round';
    }

    // The layout the roads were drawn round (#410): footprints to place props
    // over, and ideas for jumps. Never saved; they come in with the page.
    if (layers.layout) {
      for (const g of DATA.guides ?? []) {
        const pts = g.poly ?? g.line;
        ctx.beginPath();
        pts.forEach(([x, z], i) => (i ? ctx.lineTo(sx(x), sy(z)) : ctx.moveTo(sx(x), sy(z))));
        if (g.poly) {
          ctx.closePath();
          ctx.fillStyle = g.color + '26';
          ctx.fill();
        }
        ctx.setLineDash([5, 4]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = g.color + 'aa';
        ctx.stroke();
        ctx.setLineDash([]);
        if (g.poly && s > 1.1) {
          const cx = pts.reduce((a, p) => a + p[0], 0) / pts.length;
          const cz = pts.reduce((a, p) => a + p[1], 0) / pts.length;
          ctx.font = '11px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = 'rgba(240,236,226,0.7)';
          ctx.fillText(g.label, sx(cx), sy(cz) + 4);
        }
      }
      for (const idea of DATA.ideas ?? []) {
        const x = sx(idea.at[0]);
        const y = sy(idea.at[1]);
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, Math.PI * 2);
        ctx.setLineDash([3, 3]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#b99cff';
        ctx.stroke();
        ctx.setLineDash([]);
        // Which way it throws you.
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - Math.sin(idea.angle) * 22, y - Math.cos(idea.angle) * 22);
        ctx.stroke();
        ctx.font = '600 12px system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#111';
        ctx.strokeText(idea.label, x + 14, y - 8);
        ctx.fillStyle = '#d9c9ff';
        ctx.fillText(idea.label, x + 14, y - 8);
      }
    }

    for (const b of DATA.buildings) {
      const [x0, z0, x1, z1] = b.rect;
      ctx.fillStyle = b.derelict ? '#6d5845' : '#848a90';
      ctx.fillRect(sx(x1), sy(z1), (x1 - x0) * s, (z1 - z0) * s);
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#0b0f0e';
      ctx.strokeRect(sx(x1), sy(z1), (x1 - x0) * s, (z1 - z0) * s);
      if (layers.labels && s > 0.5) label(b.derelict ? 'hangar' : b.kind, sx((x0 + x1) / 2), sy((z0 + z1) / 2), '#e8dccd');
    }

    if (layers.fence) {
      const dot = (list, color, r) => {
        ctx.fillStyle = color;
        for (const [x, z] of list ?? []) ctx.fillRect(sx(x) - r, sy(z) - r, r * 2, r * 2);
      };
      dot(DATA.furniture.weed, 'rgba(128,178,94,0.75)', Math.max(0.8, 0.5 * s));
      dot(DATA.furniture.fence, 'rgba(222,226,214,0.7)', Math.max(0.9, 0.35 * s));
      dot(DATA.furniture.barrier, 'rgba(200,120,90,0.8)', Math.max(0.9, 0.35 * s));
      dot(DATA.furniture.lamp, 'rgba(255,230,150,0.9)', Math.max(1.2, 0.5 * s));
      dot(DATA.furniture.tree, 'rgba(46,110,52,0.85)', Math.max(1.5, 2.2 * s));
    }

    if (layers.generated) {
      for (const b of DATA.breakables) {
        drawProp({ kind: b.kind === 'gate' ? 'gate' : 'stack', x: b.at[0], z: b.at[1], angle: b.angle, w: b.kind === 'gate' ? b.half * 2 : undefined });
      }
      for (const c of DATA.collectibles) {
        const x = sx(c.at[0]), y = sy(c.at[1]);
        ctx.beginPath();
        if (c.kind === 'camera') { ctx.moveTo(x, y - 5); ctx.lineTo(x + 5, y + 4); ctx.lineTo(x - 5, y + 4); ctx.closePath(); ctx.fillStyle = '#5fd0e0'; }
        else { ctx.rect(x - 4, y - 4, 8, 8); ctx.fillStyle = '#ffd54f'; }
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#0b0f0e';
        ctx.stroke();
      }
      for (const [x0, z0] of DATA.repairs) {
        const x = sx(x0), y = sy(z0);
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#4f8ff0';
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '600 8px IBM Plex Mono, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('R', x, y + 0.5);
      }
      for (const a of DATA.ambushes) {
        ctx.beginPath();
        ctx.arc(sx(a.at[0]), sy(a.at[1]), Math.max(8, 40 * s), 0, Math.PI * 2);
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = '#e9615a';
        ctx.stroke();
        ctx.setLineDash([]);
        if (layers.labels) label(`ambush · heat ${a.level}`, sx(a.at[0]), sy(a.at[1]) - Math.max(8, 40 * s) - 8, '#f4a39d');
      }
    }

    // Big things first, so a cone on a plane's wing is drawn on top of it.
    const order = [...props].sort((a, b) => dims(b).w * dims(b).l - dims(a).w * dims(a).l);
    for (const p of order) drawProp(p, { sev: severity(checks.get(p) ?? []) });
    // A note is what somebody wanted said about a prop, so it shows from
    // further out; a bare kind name only once props are big enough to need
    // telling apart, or fifty trees each say "Conifer".
    if (layers.labels) {
      for (const p of order) {
        const text = p.note ? p.note : s > 3 ? KIND[p.kind].name : null;
        if (!text || (p.note && s < 0.45)) continue;
        const { l } = dims(p);
        label(text, sx(p.x), sy(p.z) + Math.max(10, (l / 2) * s + 10), '#e2ebe6');
      }
    }

    if (hover && hover !== selected) outline(hover, 'rgba(242,194,48,0.55)', 1);
    if (selected) {
      outline(selected, '#f2c230', 2);
      const [hx, hy] = handlePos(selected);
      ctx.beginPath();
      ctx.moveTo(sx(selected.x), sy(selected.z));
      ctx.lineTo(hx, hy);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(242,194,48,0.7)';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(hx, hy, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#f2c230';
      ctx.fill();
      ctx.strokeStyle = '#0b0f0e';
      ctx.stroke();
    }
    if (ghost) drawProp(ghost, { ghost: true });
    if (ROADS) drawRoadEdits();

    // Scale bar, in the only units the game uses.
    const nice = [5, 10, 20, 50, 100, 200, 500, 1000];
    const m = nice.find((n) => n * s >= 70) ?? 1000;
    $('h-scale').innerHTML = `<span style="display:inline-block;width:${Math.round(m * s)}px;border-bottom:2px solid var(--dim);height:6px;margin-right:6px;vertical-align:1px"></span>${m} m`;
  }

  function drawRoadEdits() {
    const line = (pts, color, width, dash) => {
      ctx.beginPath();
      pts.forEach(([x, z], i) => (i ? ctx.lineTo(sx(x), sy(z)) : ctx.moveTo(sx(x), sy(z))));
      ctx.setLineDash(dash ?? []);
      ctx.lineWidth = width;
      ctx.strokeStyle = color;
      ctx.stroke();
      ctx.setLineDash([]);
    };
    // Every drawn road shows its centreline faintly, so it is clear which
    // roads this editor can change.
    // A yard (#489): paved ground the sync makes an apron, drawn as itself.
    for (const r of roads) {
      if (r.kind !== 'yard' || r.points.length < 3) continue;
      ctx.beginPath();
      r.points.forEach(([x, z], i) => (i ? ctx.lineTo(sx(x), sy(z)) : ctx.moveTo(sx(x), sy(z))));
      ctx.closePath();
      ctx.fillStyle = 'rgba(155,155,146,0.45)';
      ctx.fill();
    }
    if (layers.roads) for (const r of roads) line(r.kind === 'yard' ? [...r.points, r.points[0]] : r.points, r === selRoad ? '#f2c230' : 'rgba(242,194,48,0.28)', r === selRoad ? 2 : 1);
    // Every end the sync would pull, as a red dash to where it would go.
    for (const r of roads) {
      for (const pull of pulls(r)) {
        line([pull.from, pull.to], '#e9615a', 2, [4, 3]);
        ctx.beginPath();
        ctx.arc(sx(pull.from[0]), sy(pull.from[1]), 5, 0, Math.PI * 2);
        ctx.strokeStyle = '#e9615a';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
    if (selRoad) {
      selRoad.points.forEach(([x, z], i) => {
        const big = i === selVertex;
        ctx.fillStyle = big ? '#f2c230' : '#141c1a';
        ctx.strokeStyle = '#f2c230';
        ctx.lineWidth = 1.5;
        ctx.fillRect(sx(x) - (big ? 5 : 4), sy(z) - (big ? 5 : 4), big ? 10 : 8, big ? 10 : 8);
        ctx.strokeRect(sx(x) - (big ? 5 : 4), sy(z) - (big ? 5 : 4), big ? 10 : 8, big ? 10 : 8);
      });
      if (selRoad.deadEnd) {
        const [x, z] = selRoad.points[selRoad.points.length - 1];
        ctx.beginPath();
        ctx.arc(sx(x), sy(z), 9, 0, Math.PI * 2);
        ctx.strokeStyle = '#f2c230';
        ctx.stroke();
      }
    }
    if (drawing && drawing.length) {
      const pts = drawing.cursor ? [...drawing, drawing.cursor] : drawing;
      line(pts, '#7fd6a2', Math.max(2, (DATA.roadWidths?.street ?? 10) * view.scale), [6, 4]);
      for (const [x, z] of drawing) {
        ctx.fillStyle = '#7fd6a2';
        ctx.fillRect(sx(x) - 3, sy(z) - 3, 6, 6);
      }
    }
  }

  function label(text, x, y, color) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = '500 10.5px IBM Plex Sans, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(14,20,18,0.85)';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  // ---- view -----------------------------------------------------------------
  function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
    draw();
  }
  function fit() {
    // The place and its runway (if it has one), not the margin the export carries around them.
    const xs = [DATA.centre[0] - DATA.radius, DATA.centre[0] + DATA.radius, ...DATA.runway.map((p) => p[0])];
    const zs = [DATA.centre[1] - DATA.radius, DATA.centre[1] + DATA.radius, ...DATA.runway.map((p) => p[1])];
    const x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs);
    const W = canvas.clientWidth || 800, Hh = canvas.clientHeight || 600;
    view.scale = Math.min((W - 60) / (x1 - x0), (Hh - 60) / (z1 - z0));
    view.x = W / 2 - (B.maxX - (x0 + x1) / 2) * view.scale;
    view.y = Hh / 2 - (B.maxZ - (z0 + z1) / 2) * view.scale;
  }
  function zoomAt(px, py, f) {
    const x = wx(px), z = wz(py);
    view.scale = Math.max(0.15, Math.min(40, view.scale * f));
    view.x = px - (B.maxX - x) * view.scale;
    view.y = py - (B.maxZ - z) * view.scale;
    draw();
  }
  function centreOn(p) {
    view.x = canvas.clientWidth / 2 - (B.maxX - p.x) * view.scale;
    view.y = canvas.clientHeight / 2 - (B.maxZ - p.z) * view.scale;
  }

  // ---- editing --------------------------------------------------------------
  function remember() {
    undoStack.push(snapshot());
    if (undoStack.length > 200) undoStack.shift();
  }
  function changed() {
    rebuildSegs();
    checks = new Map(props.map((p) => [p, check(p)]));
    refresh();
    draw();
  }
  function hitTest(x, z) {
    const pad = 6 / view.scale;
    let best = null, bestArea = Infinity;
    for (const p of props) {
      const { w, l } = dims(p);
      const dx = x - p.x, dz = z - p.z;
      const v = dx * Math.sin(p.angle) + dz * Math.cos(p.angle);
      const u = dx * Math.cos(p.angle) - dz * Math.sin(p.angle);
      if (Math.abs(u) <= w / 2 + pad && Math.abs(v) <= l / 2 + pad && w * l < bestArea) {
        best = p;
        bestArea = w * l;
      }
    }
    return best;
  }
  function makeProp(kind, x, z) {
    const k = KIND[kind];
    const p = { id: newId(), kind, x, z, angle: lastAngle[kind] ?? 0 };
    if (k.variants) p.variant = k.variants[0];
    if (kind === 'gate') snapGate(p);
    return p;
  }
  /** A gate stands across the road nearest it, spanning its full width. */
  function snapGate(p) {
    const n = nearestRoad(p.x, p.z);
    if (!n || n.d > 30) return;
    p.x = n.px;
    p.z = n.pz;
    p.angle = roadHeading(n.r);
    p.w = Math.round((n.r.width + 2) * 10) / 10;
  }
  /** The drawn road under a screen point, and which segment of it. */
  function roadHit(px, py) {
    let best = null;
    for (const r of roads) {
      for (let i = 1; i < r.points.length; i++) {
        const a = [sx(r.points[i - 1][0]), sy(r.points[i - 1][1])];
        const b = [sx(r.points[i][0]), sy(r.points[i][1])];
        const hit = project(px, py, a, b);
        const reach = Math.max(6, (widthOf(r) * view.scale) / 2);
        if (hit.d <= reach && (!best || hit.d < best.d)) best = { r, i, d: hit.d, x: wx(hit.px), z: wz(hit.pz) };
      }
    }
    return best;
  }
  function vertexHit(px, py) {
    if (!selRoad) return null;
    let best = null;
    selRoad.points.forEach(([x, z], i) => {
      const d = Math.hypot(sx(x) - px, sy(z) - py);
      if (d < 8 && (best === null || d < best.d)) best = { i, d };
    });
    return best && best.i;
  }
  /** Snap a point being drawn onto a road it is placed on, so the two meet. */
  function snapToRoads(x, z, except = null) {
    let best = null;
    for (const r of segs) {
      if (except && r.road === except.id) continue;
      const hit = project(x, z, r.a, r.b);
      if (hit.d * view.scale < 10 && (!best || hit.d < best.d)) best = hit;
    }
    for (const r of segs) {
      if (except && r.road === except.id) continue;
      for (const q of [r.a, r.b]) if (Math.hypot(q[0] - x, q[1] - z) * view.scale < 10) return [q[0], q[1]];
    }
    return best ? [best.px, best.pz] : [x, z];
  }
  /**
   * Where `roadsync` will pull a road's loose ends (`stitch` there): an end
   * within `STITCH` metres of another road, and not on it, is moved onto it
   * when the city is laid - unless the road is a dead end, whose far end stays
   * where it was drawn. Shown so that nothing moves by surprise.
   */
  const STITCH = 70;
  function pulls(r) {
    if (r.kind === 'yard') return [];
    const nearestTo = (at) => {
      let best = null;
      for (const q of segs) {
        if (q.road === r.id) continue;
        const hit = project(at[0], at[1], q.a, q.b);
        if (!best || hit.d < best.d) best = { ...hit, q };
      }
      return best;
    };
    const ends = [0, r.points.length - 1].map((i) => ({ i, at: r.points[i], hit: nearestTo(r.points[i]) }));
    // A dead end keeps whichever end is further from another road.
    const kept = r.deadEnd ? ((ends[0].hit?.d ?? Infinity) > (ends[1].hit?.d ?? Infinity) ? 0 : 1) : -1;
    return ends
      // A pull of a few metres is a junction being closed, not a road moving.
      .filter((e, k) => k !== kept && e.hit && e.hit.d > 4 && e.hit.d <= STITCH)
      .map((e) => ({ i: e.i, from: e.at, to: [e.hit.px, e.hit.pz], d: e.hit.d, onto: e.hit.q.road ?? 'a road outside this area' }));
  }

  function selectRoad(r, vertex = null) {
    selRoad = r;
    selVertex = vertex;
    if (r) selected = null;
    refresh();
    draw();
  }
  function finishDrawing() {
    if (!drawing) return;
    const yard = mode === 'yard';
    if (drawing.length >= (yard ? 3 : 2)) {
      remember();
      const r = { id: newId().replace(/^p/, yard ? 'y' : 'e'), kind: yard ? 'yard' : 'street', district: DATA.district ?? 'midtown', bridge: false, points: drawing.map((q) => [...q]), isNew: true };
      roads.push(r);
      drawing = null;
      setMode('select');
      selectRoad(r);
      changed();
      toast(yard ? 'Yard added' : 'Road added');
      return;
    }
    drawing = null;
    draw();
  }
  function removeRoadOrPoint() {
    if (!selRoad) return;
    remember();
    if (selVertex !== null && selRoad.points.length > (selRoad.kind === 'yard' ? 3 : 2)) {
      selRoad.points.splice(selVertex, 1);
      selVertex = null;
    } else {
      if (exported.has(selRoad.id)) removedRoads.push(selRoad.id);
      roads = roads.filter((r) => r !== selRoad);
      selRoad = null;
      selVertex = null;
    }
    changed();
  }
  function editRoad(fn) {
    if (!selRoad) return;
    remember();
    fn(selRoad);
    changed();
  }
  $('r-kind').onchange = () => editRoad((r) => { r.kind = $('r-kind').value; });
  $('r-surface').onchange = () => editRoad((r) => { r.surface = $('r-surface').value; });
  $('r-dead').onchange = () => editRoad((r) => { r.deadEnd = $('r-dead').checked; });
  $('r-delpoint').onclick = () => removeRoadOrPoint();
  $('r-del').onclick = () => { selVertex = null; removeRoadOrPoint(); };
  $('k-road').onclick = () => setMode(mode === 'road' ? 'select' : 'road');
  $('k-yard').onclick = () => setMode(mode === 'yard' ? 'select' : 'yard');
  const outlining = () => mode === 'road' || mode === 'yard';

  function select(p) {
    selected = p;
    if (p) { selRoad = null; selVertex = null; }
    refresh();
    draw();
  }
  function setMode(m) {
    mode = m;
    ghost = null;
    if (m !== 'road' && m !== 'yard') drawing = null;
    canvas.style.cursor = m === 'select' ? 'default' : 'crosshair';
    refresh();
    draw();
  }

  // ---- panel ----------------------------------------------------------------
  function glyph(k) {
    const c = document.createElement('canvas');
    const r = window.devicePixelRatio || 1;
    c.width = 22 * r;
    c.height = 22 * r;
    const g = c.getContext('2d');
    const w = k.shape === 'cone' ? 6 : k.w, l = k.shape === 'cone' ? 6 : k.l;
    // The crane's jib runs off the icon rather than shrinking the crane to a dot.
    const span = Math.max(w, l) * (k.jib ? 2.2 : 1);
    const s = (18 * r) / span;
    // Front up, as a prop placed at heading 0 looks on the map.
    g.setTransform(-s, 0, 0, -s, 11 * r, 11 * r);
    shapePath(k, w, l, g);
    g.fillStyle = k.color;
    g.fill();
    g.lineWidth = 1.2 / s;
    g.strokeStyle = '#0b0f0e';
    g.stroke();
    g.strokeStyle = 'rgba(11,15,14,0.8)';
    drawDetail(k, w, l, g, 1 / s);
    return c;
  }

  function buildPalette() {
    const root = $('palette');
    let group = null, box = null;
    for (const k of KINDS) {
      if (k.group !== group) {
        group = k.group;
        box = document.createElement('div');
        box.className = 'group';
        box.innerHTML = `<div class="group-name">${group}</div>`;
        root.append(box);
      }
      const b = document.createElement('button');
      b.className = 'kind';
      b.id = `k-${k.id}`;
      b.setAttribute('aria-pressed', 'false');
      const meta = document.createElement('span');
      meta.className = 'meta';
      const name = document.createElement('span');
      name.textContent = k.name;
      const size = document.createElement('span');
      size.className = 'size';
      size.textContent = k.shape === 'circle' || k.shape === 'tower' || k.shape === 'tree' || k.shape === 'cone'
        ? `⌀ ${k.w} m`
        : k.id === 'gate' ? 'spans its road' : k.sizes ? 'ramp, mound or slab' : `${k.w} × ${k.l} m`;
      meta.append(name, size);
      const count = document.createElement('span');
      count.className = 'count';
      count.id = `c-${k.id}`;
      b.append(glyph(k), meta, count);
      b.onclick = () => setMode(mode === k.id ? 'select' : k.id);
      box.append(b);
    }
  }

  function buildLayers() {
    const names = { relief: 'Relief', roads: 'Roads', fence: 'Fence & weeds', generated: 'Generated', outline: 'Field outline', labels: 'Labels' };
    if ((DATA.guides ?? []).length || (DATA.ideas ?? []).length) names.layout = 'Layout guide';
    if ((DATA.freeway?.segments ?? []).length) names.freeway = 'Freeway';
    for (const [id, text] of Object.entries(names)) {
      const l = document.createElement('label');
      const i = document.createElement('input');
      i.type = 'checkbox';
      i.id = `l-${id}`;
      i.checked = layers[id];
      i.onchange = () => { layers[id] = i.checked; draw(); };
      l.append(i, text);
      $('layers').append(l);
    }
  }

  const attention = () => props.filter((p) => severity(checks.get(p) ?? []) !== 'ok');

  function refresh() {
    if (ROADS) {
      $('k-road').setAttribute('aria-pressed', String(mode === 'road'));
      $('c-road').textContent = roads.filter((r) => r.kind !== 'yard').length;
      $('k-yard').setAttribute('aria-pressed', String(mode === 'yard'));
      const yards = roads.filter((r) => r.kind === 'yard').length;
      $('c-yard').textContent = yards ? yards : '';
    }
    for (const k of KINDS) {
      $(`k-${k.id}`).setAttribute('aria-pressed', String(mode === k.id));
      const n = props.filter((p) => p.kind === k.id).length;
      $(`c-${k.id}`).textContent = n ? n : '';
    }
    const need = attention();
    const loose = ROADS ? roads.filter((r) => pulls(r).length) : [];
    $('count').innerHTML = `${props.length} placed` + (need.length ? ` · <button id="attention">${need.length} need a look</button>` : '')
      + (loose.length ? ` · <button id="loose">${loose.length} road end${loose.length > 1 ? 's' : ''} will move</button>` : '');
    if (loose.length) $('loose').onclick = () => {
      const r = loose[0];
      const pull = pulls(r)[0];
      centreOn({ x: pull.from[0], z: pull.from[1] });
      selectRoad(r, pull.i);
    };
    if (need.length) $('attention').onclick = () => {
      attentionAt = (attentionAt + 1) % need.length;
      selected = need[attentionAt];
      centreOn(selected);
      refresh();
      draw();
    };
    const dirty = snapshot() !== saved;
    $('dirty').textContent = dirty ? 'unsaved' : 'saved';
    $('dirty').className = dirty ? 'dirty' : '';
    $('undo').disabled = !undoStack.length;
    $('revert').disabled = !dirty;

    $('hint').innerHTML = mode === 'yard'
      ? 'Click each corner of the yard · <kbd>Enter</kbd> or double-click to close it · <kbd>Esc</kbd> cancel · roads that end inside it close to traffic'
      : mode === 'road'
      ? 'Click to add points - they snap onto a road you click on · <kbd>Enter</kbd> or double-click to finish · <kbd>Esc</kbd> cancel'
      : mode === 'select'
      ? 'Drag to move · handle to turn · <kbd>R</kbd> ±15° · <kbd>Del</kbd> remove · drag the map to pan' + (ROADS ? ' · click a road to edit it, drag its points (they snap onto a road), <kbd>Shift</kbd>-click it to add one · a red dash is an end the sync would move' : '')
      : `Click to place ${KIND[mode].name.toLowerCase()}${mode === 'gate' ? ' - it snaps across the nearest road' : ''} · <kbd>R</kbd> turns it · <kbd>Esc</kbd> done`;

    $('none').hidden = !!selected || !!selRoad;
    $('detail').hidden = !selected;
    $('road-detail').hidden = !selRoad;
    if (selRoad) {
      const r = selRoad;
      let len = 0;
      for (let i = 1; i < r.points.length; i++) len += Math.hypot(r.points[i][0] - r.points[i - 1][0], r.points[i][1] - r.points[i - 1][1]);
      $('r-id').textContent = exported.has(r.id) ? r.id : `${r.id} (new)`;
      $('r-kind').value = r.kind;
      $('r-surface').value = r.surface ?? 'asphalt';
      $('r-dead').checked = !!r.deadEnd;
      const fewest = r.kind === 'yard' ? 3 : 2;
      $('r-delpoint').disabled = selVertex === null || r.points.length <= fewest;
      const warn = pulls(r).map((pull) => `<li class="warn">${pull.i === 0 ? 'Start' : 'End'} will be joined to ${pull.onto}, ${Math.round(pull.d)} m away, when synced - drag it onto the road, or tick Dead end to keep it where it is</li>`).join('');
      if (r.kind === 'yard') {
        // Shoelace: the yard's area, which is what matters about one.
        let twice = 0;
        r.points.forEach(([x, z], i) => { const [x2, z2] = r.points[(i + 1) % r.points.length]; twice += x * z2 - x2 * z; });
        $('r-info').innerHTML = `<li class="info">${Math.round(Math.abs(twice) / 2).toLocaleString()} m² · ${r.points.length} corners · roads ending inside it close to traffic</li>`;
      } else $('r-info').innerHTML = warn + `<li class="info">${Math.round(len)} m · ${r.points.length} points</li>`;
    }
    if (!selected) return;
    const p = selected, k = KIND[p.kind];
    $('d-kind').textContent = k.name;
    $('f-variant').hidden = !k.variants;
    if (k.variants) {
      $('d-variant').innerHTML = k.variants.map((v) => `<option>${v}</option>`).join('');
      $('d-variant').value = p.variant ?? k.variants[0];
    }
    if (document.activeElement !== $('d-x')) $('d-x').value = Math.round(p.x);
    if (document.activeElement !== $('d-z')) $('d-z').value = Math.round(p.z);
    if (document.activeElement !== $('d-a')) $('d-a').value = Math.round(((p.angle * 180) / Math.PI + 360) % 360);
    $('f-w').hidden = p.kind !== 'gate';
    if (p.kind === 'gate') $('d-w').value = dims(p).w;
    if (document.activeElement !== $('d-note')) $('d-note').value = p.note ?? '';
    const list = checks.get(p) ?? check(p);
    const g = heightAt(p.x, p.z);
    const ground = g === undefined || g === H.water ? '' : `<li class="info">Ground ${g} m above the sea</li>`;
    $('d-checks').innerHTML = (list.length ? '' : '<li class="ok">Clear of roads, water and buildings</li>')
      + list.map(([sev, text]) => `<li class="${sev}">${text}</li>`).join('') + ground;
  }

  function edit(fn) {
    if (!selected) return;
    remember();
    fn(selected);
    lastAngle[selected.kind] = selected.angle;
    changed();
  }
  $('d-variant').onchange = () => edit((p) => { p.variant = $('d-variant').value; });
  $('d-x').onchange = () => edit((p) => { p.x = Number($('d-x').value) || p.x; });
  $('d-z').onchange = () => edit((p) => { p.z = Number($('d-z').value) || p.z; });
  $('d-a').onchange = () => edit((p) => { p.angle = ((Number($('d-a').value) || 0) * Math.PI) / 180; });
  $('d-w').onchange = () => edit((p) => { p.w = Math.max(1, Number($('d-w').value) || dims(p).w); });
  $('d-note').onchange = () => edit((p) => { p.note = $('d-note').value.trim() || undefined; });
  $('align').onclick = () => edit((p) => {
    if (p.kind === 'gate') { snapGate(p); return; }
    const n = nearestRoad(p.x, p.z);
    if (n && n.d < 80) p.angle = roadHeading(n.r);
    else toast('No road within 80 m to line up with');
  });
  $('dupe').onclick = () => duplicate();
  $('del').onclick = () => remove();
  function duplicate() {
    if (!selected) return;
    remember();
    const { w } = dims(selected);
    const off = Math.max(3, w * 1.2);
    const q = { ...selected, id: newId(), x: selected.x + Math.cos(selected.angle) * off, z: selected.z - Math.sin(selected.angle) * off };
    props.push(q);
    selected = q;
    changed();
  }
  function remove() {
    if (!selected) return;
    remember();
    props = props.filter((p) => p !== selected);
    selected = null;
    changed();
  }
  function undo() {
    const prev = undoStack.pop();
    if (prev == null) return;
    const id = selected && selected.id;
    const rid = selRoad && selRoad.id;
    restore(prev);
    selected = props.find((p) => p.id === id) ?? null;
    selRoad = roads.find((r) => r.id === rid) ?? null;
    selVertex = null;
    changed();
  }
  function rotate(delta) {
    if (mode !== 'select' && ghost) {
      lastAngle[mode] = (lastAngle[mode] ?? 0) + delta;
      ghost.angle = lastAngle[mode];
      draw();
      return;
    }
    edit((p) => { p.angle += delta; });
  }
  $('undo').onclick = undo;
  $('revert').onclick = () => {
    remember();
    restore(saved);
    selected = null;
    selRoad = null;
    selVertex = null;
    changed();
    toast('Back to the last save');
  };

  // ---- pointer --------------------------------------------------------------
  const local = (e) => {
    const r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    const [px, py] = local(e);
    const x = wx(px), z = wz(py);
    if (e.button === 1 || e.button === 2) {
      drag = { type: 'pan', px, py, vx: view.x, vy: view.y };
      return;
    }
    if (outlining()) {
      const at = mode === 'yard' ? [x, z] : snapToRoads(x, z);
      drawing = drawing ?? [];
      const last = drawing[drawing.length - 1];
      // A second click on the last point finishes the road.
      if (last && Math.hypot(sx(last[0]) - px, sy(last[1]) - py) < 8) { finishDrawing(); return; }
      drawing.push(at);
      draw();
      return;
    }
    if (mode !== 'select') {
      remember();
      const p = makeProp(mode, x, z);
      props.push(p);
      selected = p;
      changed();
      return;
    }
    if (selected) {
      const [hx, hy] = handlePos(selected);
      if (Math.hypot(px - hx, py - hy) < 10) {
        drag = { type: 'turn', before: snapshot(), p: selected };
        return;
      }
    }
    if (ROADS && selRoad) {
      const v = vertexHit(px, py);
      if (v !== null) {
        selVertex = v;
        drag = { type: 'vertex', before: snapshot(), r: selRoad, i: v, moved: false };
        refresh();
        draw();
        return;
      }
    }
    // A click on a carriageway is the road, whatever prop is near it: nothing
    // stands on a road. Off the carriageway, a prop wins and the road's wider
    // grab margin only counts on open ground.
    const rh = ROADS ? roadHit(px, py) : null;
    const onCarriageway = rh && rh.d <= (widthOf(rh.r) * view.scale) / 2;
    const hit = onCarriageway ? null : hitTest(x, z);
    if (rh && (onCarriageway || !hit)) {
      if (e.shiftKey && rh.r === selRoad) {
        // Shift-click on the selected road puts a new point there, ready to drag.
        const before = snapshot();
        rh.r.points.splice(rh.i, 0, [rh.x, rh.z]);
        selVertex = rh.i;
        drag = { type: 'vertex', before, r: rh.r, i: rh.i, moved: true };
        changed();
        return;
      }
      selectRoad(rh.r);
      drag = { type: 'pan', px, py, vx: view.x, vy: view.y };
      return;
    }
    if (hit) {
      selRoad = null;
      selVertex = null;
      selected = hit;
      drag = { type: 'move', before: snapshot(), p: hit, dx: x - hit.x, dz: z - hit.z, moved: false };
      refresh();
      draw();
    } else {
      selected = null;
      selRoad = null;
      selVertex = null;
      refresh();
      drag = { type: 'pan', px, py, vx: view.x, vy: view.y };
      draw();
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    const [px, py] = local(e);
    const x = wx(px), z = wz(py);
    const g = heightAt(x, z);
    $('h-x').textContent = Math.round(x);
    $('h-z').textContent = Math.round(z);
    $('h-y').textContent = g === undefined ? '—' : g === H.water ? 'water' : `${g} m`;
    if (drag?.type === 'pan') {
      view.x = drag.vx + (px - drag.px);
      view.y = drag.vy + (py - drag.py);
      draw();
      return;
    }
    if (drag?.type === 'vertex') {
      drag.r.points[drag.i] = [x, z];
      drag.moved = true;
      rebuildSegs();
      draw();
      return;
    }
    if (outlining()) {
      if (drawing) { drawing.cursor = [x, z]; draw(); }
      return;
    }
    if (drag?.type === 'move') {
      drag.p.x = x - drag.dx;
      drag.p.z = z - drag.dz;
      drag.moved = true;
      checks.set(drag.p, check(drag.p));
      refresh();
      draw();
      return;
    }
    if (drag?.type === 'turn') {
      let a = Math.atan2(x - drag.p.x, z - drag.p.z);
      if (e.shiftKey) a = Math.round(a / (Math.PI / 12)) * (Math.PI / 12);
      drag.p.angle = a;
      checks.set(drag.p, check(drag.p));
      refresh();
      draw();
      return;
    }
    if (mode !== 'select') {
      ghost = makeProp(mode, x, z);
      draw();
      return;
    }
    const h = hitTest(x, z);
    if (h !== hover) {
      hover = h;
      canvas.style.cursor = h ? 'move' : 'default';
      draw();
    }
  });
  const end = () => {
    if (drag && drag.type === 'vertex') {
      // Let go near a road and the point lands on it exactly: a junction.
      if (drag.moved) drag.r.points[drag.i] = snapToRoads(drag.r.points[drag.i][0], drag.r.points[drag.i][1], drag.r);
      if (drag.moved) undoStack.push(drag.before);
      drag = null;
      changed();
      return;
    }
    if (drag && (drag.type === 'move' || drag.type === 'turn')) {
      if (drag.type === 'turn' || drag.moved) {
        undoStack.push(drag.before);
        lastAngle[drag.p.kind] = drag.p.angle;
      }
      drag = null;
      changed();
      return;
    }
    drag = null;
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', () => { if (ghost) { ghost = null; draw(); } });
  canvas.addEventListener('dblclick', () => { if (outlining()) finishDrawing(); });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const [px, py] = local(e);
    zoomAt(px, py, Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });
  $('zin').onclick = () => zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 1.5);
  $('zout').onclick = () => zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 1 / 1.5);
  $('zfit').onclick = () => { fit(); draw(); };

  window.addEventListener('keydown', (e) => {
    const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName ?? '');
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd' && !typing) { e.preventDefault(); duplicate(); return; }
    if (typing) return;
    if (e.key === 'Enter' && outlining()) { finishDrawing(); return; }
    if (e.key === 'Escape') { if (mode !== 'select') setMode('select'); else if (selRoad) selectRoad(null); else select(null); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selRoad) { e.preventDefault(); removeRoadOrPoint(); return; }
    if (e.key === 'r' || e.key === 'R') { rotate((e.shiftKey ? -1 : 1) * (Math.PI / 12)); return; }
    if (e.key === 'a' || e.key === 'A') { $('align').click(); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selected) { e.preventDefault(); remove(); return; }
    const nudge = { ArrowLeft: [1, 0], ArrowRight: [-1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
    if (nudge && selected) {
      e.preventDefault();
      const step = e.shiftKey ? 5 : 1;
      edit((p) => { p.x += nudge[0] * step; p.z += nudge[1] * step; });
    }
  });

  let toastTimer = null;
  function toast(message) {
    const el = $('toast');
    el.textContent = message;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('on'), 2600);
  }

  // ---- saving ---------------------------------------------------------------
  // One document holding the whole placement set, like the Road Editor's
  // `edits/roads`: a patch is a thing that can be applied to the wrong
  // version, and the set is small. Claude reads it back and `propsync`
  // writes it into the generator. Without the store the page is still an
  // editor; it just cannot hand anything over.
  const DOC = 'edits/props';
  let db = null;
  $('save').disabled = true;
  $('save').textContent = 'Connecting…';
  const use = window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null);
  use.then(async (it) => {
    db = it;
    if (!db) {
      $('save').textContent = 'Saving unavailable';
      return;
    }
    $('save').disabled = false;
    $('save').textContent = 'Save placements';
    try {
      const snap = await db.doc(DOC).get();
      const doc = snap && snap.exists ? snap.data() : null;
      if (!doc || !Array.isArray(doc.props) || doc.seed !== DATA.seed) return;
      const hadEdits = props.length > 0;
      if (hadEdits) remember();
      props = doc.props.map((p) => ({ ...p }));
      if (ROADS && Array.isArray(doc.roads)) {
        roads = doc.roads.map((r) => ({ ...r, points: r.points.map((q) => [...q]) }));
        removedRoads = doc.removedRoads ?? [];
      }
      saved = snapshot();
      selected = null;
      changed();
      toast(`Opened your last save · ${props.length} props`);
    } catch {
      // An unreadable save is not a reason to show nothing: the field is
      // still there and still editable.
    }
  }).catch(() => { $('save').textContent = 'Saving unavailable'; });

  $('save').onclick = async () => {
    if (!db) return;
    $('save').disabled = true;
    try {
      await db.doc(DOC).set({
        seed: DATA.seed,
        place: DATA.place,
        savedAt: new Date().toISOString(),
        props: props.map(clean),
        ...(ROADS ? { roads: roads.map(cleanRoad), removedRoads } : {}),
      });
      saved = snapshot();
      refresh();
      toast(ROADS ? `Saved ${props.length} props and ${roads.length} roads` : `Saved ${props.length} props`);
    } catch (err) {
      toast(`Could not save (${err && err.code ? err.code : 'unknown error'}). Your placements are still here - try again.`);
    } finally {
      $('save').disabled = false;
    }
  };

  // ---- start ----------------------------------------------------------------
  $('sub').textContent = `seed ${DATA.seed} · ${Math.round(B.maxX - B.minX)} × ${Math.round(B.maxZ - B.minZ)} m of ground`;
  buildPalette();
  buildLayers();
  $('roads-section').hidden = !ROADS;
  // Only an area whose yards the game reads offers to draw one (#489).
  $('k-yard').hidden = !DATA.yards;
  // What counts as saved before the first save: no props (so a fresh draft
  // reads as unsaved, as it always has) and the roads as the export drew them.
  saved = ROADS ? JSON.stringify({ props: [], roads: roads.map(cleanRoad), removedRoads: [] }) : '[]';
  new ResizeObserver(resize).observe(canvas);
  canvas.width = Math.round(canvas.clientWidth * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);
  fit();
  changed();
})();
</script>
