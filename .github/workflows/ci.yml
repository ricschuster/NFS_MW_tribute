name: CI

# PRs only. Every change reaches main through a PR that has already passed
# this, and main is not required to be up to date before a merge, so a second
# run after the merge would repeat the same checks. Deploy still builds main
# (typecheck included) on every push, which catches two green PRs that break
# the build together.
on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
